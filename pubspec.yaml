name: classscheduler
description: AI-Powered Classroom Timetable Generator
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management (pinned to 2.x — 3.x removed StateNotifier/StateProvider) ---
  flutter_riverpod: ">=2.5.0 <3.0.0"

  # --- Navigation ---
  go_router: ">=12.0.0 <15.0.0"

  # --- Firebase (pinned to 3.x — 4.x has breaking changes) ---
  firebase_core: ">=3.0.0 <4.0.0"
  firebase_auth: ">=5.0.0 <6.0.0"
  cloud_firestore: ">=5.0.0 <6.0.0"

  # --- Auth providers ---
  google_sign_in: ">=6.0.0 <7.0.0"
  sign_in_with_apple: ">=6.0.0 <7.0.0"

  # --- In-App Purchase ---
  purchases_flutter: ">=4.0.0 <10.0.0"

  # --- Data / Models ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.4.2

  # --- Export ---
  pdf: ">=3.11.0 <4.0.0"
  printing: ">=5.13.0 <6.0.0"
  excel: ">=4.0.0 <5.0.0"

  # --- UI / UX ---
  google_fonts: ">=6.0.0 <7.0.0"
  cached_network_image: ">=3.3.0 <4.0.0"
  shimmer: ^3.0.0
  lottie: ">=3.1.0 <4.0.0"
  fl_chart: ">=0.68.0 <1.0.0"
  reorderables: ^0.6.0
  url_launcher: ">=6.3.0 <7.0.0"

  # --- Utils ---
  intl: ^0.20.0
  connectivity_plus: ">=6.0.0 <7.0.0"
  shared_preferences: ">=2.3.0 <3.0.0"
  collection: ^1.18.0
  equatable: ^2.0.5
  logger: ">=2.4.0 <3.0.0"
  path_provider: ">=2.1.0 <3.0.0"
  share_plus: ">=9.0.0 <10.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ">=2.4.0 <3.0.0"
  freezed: ^2.5.8
  json_serializable: ">=6.9.0 <7.0.0"
  mockito: ">=5.4.0 <6.0.0"
  fake_cloud_firestore: ">=3.1.0 <5.0.0"
  integration_test:
    sdk: flutter
  # Icon + splash generators. Source art is built by test/generate_icon.dart:
  #   flutter test test/generate_icon.dart
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ">=0.13.0 <0.15.0"
  flutter_native_splash: ">=2.3.0 <3.0.0"

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#6C63FF"
  image: "assets/icon/splash_logo.png"
  android: true
  ios: true
  web: false
  android_12:
    color: "#6C63FF"
    image: "assets/icon/splash_logo.png"
