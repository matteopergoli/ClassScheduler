name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (lib/ only — tool/ has known-broken scripts, see CLAUDE.md)
        run: flutter analyze lib

      - name: Run tests
        # A few scheduler tests (e.g. ALG-T16, ALG-T06) run the simulated
        # annealer against a fixed wall-clock budget (saMaxWallSecs) rather
        # than a pure iteration count — under CPU contention they can do
        # fewer real iterations in that window and intermittently miss a
        # convergence assertion. Not an app bug (see CLAUDE.md). Concurrency
        # 1 avoids the CI runner's own test-vs-test contention; the retry
        # loop is a safety net for any residual runner-speed flakiness.
        run: |
          for i in 1 2 3; do
            flutter test --concurrency=1 && exit 0
            echo "flutter test failed (attempt $i/3) — retrying" >&2
          done
          exit 1
